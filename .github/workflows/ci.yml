name: CI

# ---------------------------------------------------------------------------
# 这个工作流里没有 "deploy" 这一步，这是刻意的。
#
# 在 GitOps 模型下，CI 的职责到"把镜像推进仓库、把新 tag 写回期望状态"就结束了。
# 真正让集群发生变化的，是集群里的 ArgoCD 发现 git 变了。
#
# 这就是 push 式部署和 pull 式部署的分水岭：
#   push 式：CI 需要 kubeconfig，集群凭证散落在 CI 系统里；
#   pull 式：CI 只需要能写 git，集群凭证从不离开集群。
#
# 所以最后一个 job 叫 gitops —— 它做的是"提交一个新的期望状态"，
# 而不是"部署"。CD 不是这个文件里的某个 job，CD 是 ArgoCD 本身。
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]

# 同一个分支只保留最新一次运行：
# 既省配额，也避免"旧提交的镜像后推上去、覆盖新提交"的竞态。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 默认最小权限；需要额外权限的 job 各自声明。
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # github.repository 形如 am-okalin/cnlab，拼出来就是 ghcr.io/am-okalin/cnlab
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # -------------------------------------------------------------------------
  # 1. 质量门：格式 / 静态检查 / 测试
  # -------------------------------------------------------------------------
  quality:
    name: 质量门
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # 直接读 go.mod 里的版本，避免 CI 和本地用的 Go 版本漂移。
          go-version-file: go.mod
          cache: true

      - name: 检查格式
        run: |
          # 只检查 git 跟踪的 .go 文件，而不是 `gofmt -l .`。
          # 一方面与本地 make fmt-check 保持一致，另一方面 gofmt 会无差别
          # 递归目录树，一旦工作区里有 vendor / 缓存目录就会刷出大量误报。
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请本地执行 make fmt："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # 用和本地完全相同的 golangci-lint 版本。
      # 版本不一致会导致"本地过、CI 挂"或反过来，是最消耗耐心的那类问题。
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: 测试（含竞态检测）
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: 覆盖率
        run: go tool cover -func=coverage.out | tail -1

  # -------------------------------------------------------------------------
  # 2. 清单校验：清单改坏了必须在这里被拦住，而且是真的拦得住
  #    （image job 依赖本 job，见下面的说明）
  # -------------------------------------------------------------------------
  manifests:
    name: 校验清单
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 安装 kustomize（与本地同一版本）
        run: ./hack/install-tools.sh

      - name: 渲染全部 overlay
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          mkdir -p /tmp/manifests
          for dir in deploy/overlays/*/; do
            name="$(basename "$dir")"
            echo "--- 渲染 $name"
            kustomize build "$dir" > "/tmp/manifests/${name}.yaml"
          done

      # kustomize build 只保证"能渲染"，不保证"字段合法"。
      # kubeconform 拿官方 JSON Schema 做离线校验，能在合并前抓出
      # 拼错的字段名、放错层级的字段、以及引用了不存在的 apiVersion。
      - name: 校验 Kubernetes schema
        run: |
          set -euo pipefail
          # 这里刻意用官方预编译二进制，而不是 `go install`：
          # kubeconform v0.8.0 要求 go >= 1.26，而 actions/setup-go 默认会设
          # GOTOOLCHAIN=local，禁止自动下载更新的工具链，于是 go install
          # 直接报 "requires go >= 1.26 (running go 1.25.x)" 而失败。
          # 用发布二进制还顺带省掉了编译时间。
          KUBECONFORM_VERSION=v0.8.0
          curl -sSL --retry 3 --retry-delay 2 -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          /tmp/kubeconform -v

          for f in /tmp/manifests/*.yaml; do
            echo "--- 校验 $f"
            /tmp/kubeconform -strict -summary -ignore-missing-schemas "$f"
          done

  # -------------------------------------------------------------------------
  # 3. 构建并推送镜像
  # -------------------------------------------------------------------------
  image:
    name: 构建镜像
    runs-on: ubuntu-latest
    # 这里必须同时依赖 manifests。
    #
    # 这是一个真实踩到的结构性疏漏：最初只写了 needs: quality，于是清单
    # 校验失败既拦不住镜像构建，也拦不住 GitOps 提交。第一次运行的日志就是
    # 铁证 ——「校验清单」05:30:15 失败，「构建镜像」05:31:54 成功，
    # 「更新期望状态」05:32:09 成功，并把错误的 latest 写进了仓库。
    # 一个不会阻断下游的检查，不能叫质量门。
    #
    # 代价很小：quality 和 manifests 之间没有依赖，仍然并行执行，
    # 只是两者都通过之后才轮到 image。
    needs: [quality, manifests]
    permissions:
      contents: read
      packages: write # 推 GHCR 需要
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # 这里刻意没有 setup-qemu-action。
      # 因为 Dockerfile 的构建阶段用了 --platform=$BUILDPLATFORM，
      # 交叉编译由 Go 自己完成（GOARCH），并不需要真的执行目标架构的二进制。
      # 少装 QEMU，构建快一个数量级。
      # 如果你的 Dockerfile 变成在构建阶段运行目标架构程序（比如 apt install
      # arm64 包），就必须把 QEMU 加回来。

      - name: 登录 GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN 是每个工作流自动注入的短期凭证，不需要自己配 secret。
          password: ${{ secrets.GITHUB_TOKEN }}

      # 显式算出"不可变 tag"，不依赖 metadata-action 的 version 输出。
      #
      # 这是一个真实踩到的坑：metadata-action 的 version 输出会按优先级挑一个
      # tag，而 type=raw,value=latest 的优先级高于 type=sha，于是拿到的是
      # "latest"。用它去更新期望状态，等于把不可追溯的 latest 写进了 GitOps
      # 仓库 —— 正好破坏掉"用不可变 tag 才能回答线上跑的是哪份代码"这个前提。
      # 自己算最直白，也不用去记 action 的优先级规则。
      - name: 计算不可变 tag
        id: tag
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: 生成镜像标签与 OCI 元数据
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # 主 tag：上面算出的不可变值
            type=raw,value=${{ steps.tag.outputs.value }}
            # main 分支额外打一个 latest（方便人类，生产别用它）
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 生成构建时间
        id: buildmeta
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: 构建并推送（amd64 + arm64）
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # PR 只构建不推送：PR 来自 fork 时本来也拿不到 packages:write，
          # 而且"合并才发布"是应有的纪律。
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.tag.outputs.value }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.buildmeta.outputs.time }}
          # GitHub Actions 缓存后端，跨运行复用构建层。
          # 对多架构构建来说这一项能省掉大半时间。
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------------
  # 4. 更新期望状态（GitOps 的交接点）
  # -------------------------------------------------------------------------
  gitops:
    name: 更新 staging 期望状态
    runs-on: ubuntu-latest
    needs: image
    # 只有合并进 main 才更新期望状态。tag 构建用于发布，
    # 不走这条自动路径 —— 生产要人工提升。
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write # 需要提交回仓库
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: 安装 kustomize（与本地同一版本）
        run: ./hack/install-tools.sh

      - name: 把新镜像写进 staging overlay
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          cd deploy/overlays/staging
          kustomize edit set image "cnlab=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.image.outputs.tag }}"
          echo "--- 改动后的 images 段 ---"
          grep -A4 '^images:' kustomization.yaml

      - name: 提交并推送
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add deploy/overlays/staging/kustomization.yaml

          # 幂等：镜像 tag 没变就什么都不做，避免制造无意义的空提交。
          if git diff --cached --quiet; then
            echo "期望状态无变化，跳过提交"
            exit 0
          fi

          git commit -m "chore(gitops): staging -> ${{ needs.image.outputs.tag }} [skip ci]"
          git push origin main
          echo "已提交。接下来由集群内的 ArgoCD 发现变化并同步。"

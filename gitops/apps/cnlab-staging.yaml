# staging 环境：同样自动同步，但镜像来自 GHCR，tag 由 CI 自动写入。
#
# 注意 staging 的 tag 不是固定的 `:staging`，而是每次 CI 构建产出的
# 不可变 tag（如 `sha-f24b9a4`）。它写在 deploy/overlays/staging 里，
# 由 CI 的 gitops job 自动提交 —— 这个文件本身不含任何镜像信息。
#
# 它和 dev 的差别只体现在 overlay 里，Application 这一层几乎一样。
# 这个"几乎一样"本身就是重点：环境之间的差异应该收敛到少数几个
# 显式声明的地方，而不是散落在整套重复的清单里。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnlab-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/am-okalin/cnlab.git
    targetRevision: main
    path: deploy/overlays/staging

  destination:
    server: https://kubernetes.default.svc
    namespace: cnlab-staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
